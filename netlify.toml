# Netlify configuration for www.aattrl.com (AATTRL, the platform for industry within nature's limits).
# Static site: no build step. Publish the repository root. Pages are generated
# from _build/content.py by `python3 _build/build.py` and committed.

[build]
  publish = "."
  command = ""

# --- Future: Zoho-style product path -----------------------------------------
# To serve Enaivu at aattrl.com/one instead of enaivu.com, uncomment the
# proxy below AFTER the Enaivu app has been rebuilt with basePath "/one".
#
# [[redirects]]
#   from = "/one/*"
#   to = "https://enaivu.com/one/:splat"
#   status = 200
#   force = true

# --- Redirects from the two previous sites --------------------------------------
[[redirects]]
  from = "/services/*"
  to = "/programmes/"
  status = 301

[[redirects]]
  from = "/industries/*"
  to = "/stakeholders/"
  status = 301

[[redirects]]
  from = "/experts/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/training/"
  to = "/programmes/"
  status = 301

[[redirects]]
  from = "/request-expert/"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/request-proposal/"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/join-expert-network/"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/how-it-works/"
  to = "/programmes/"
  status = 301

[[redirects]]
  from = "/challenges/*"
  to = "/pathways/"
  status = 301

[[redirects]]
  from = "/engagements/*"
  to = "/programmes/"
  status = 301

[[redirects]]
  from = "/who-we-serve/"
  to = "/stakeholders/"
  status = 301

[[redirects]]
  from = "/network/"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/bring-a-challenge/"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/insights/*"
  to = "/knowledge/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
