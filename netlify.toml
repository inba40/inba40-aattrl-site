# Netlify configuration for www.aattrl.com (AATTRL, executive problem-solving).
# Static site: no build step. Publish the repository root. Pages are generated
# from _build/content.py by `python3 _build/build.py` and committed.

[build]
  publish = "."
  command = ""

# --- Future: Zoho-style product path -----------------------------------------
# To serve Enaivu at aattrl.com/one instead of enaivu.com, uncomment the
# proxy below AFTER the Enaivu app has been rebuilt with basePath "/one".
# Doing it in the other order shows a broken page. See the enaivu-site repo,
# docs/DEPLOYMENT.md, "Path migration".
#
# [[redirects]]
#   from = "/one/*"
#   to = "https://enaivu.com/one/:splat"
#   status = 200
#   force = true

# --- Redirects from the previous (engineering advisory) site -------------------
[[redirects]]
  from = "/services/*"
  to = "/engagements/"
  status = 301

[[redirects]]
  from = "/industries/*"
  to = "/who-we-serve/"
  status = 301

[[redirects]]
  from = "/experts/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/training/"
  to = "/engagements/"
  status = 301

[[redirects]]
  from = "/request-expert/"
  to = "/bring-a-challenge/"
  status = 301

[[redirects]]
  from = "/request-proposal/"
  to = "/bring-a-challenge/"
  status = 301

[[redirects]]
  from = "/join-expert-network/"
  to = "/network/"
  status = 301

[[redirects]]
  from = "/insights/what-is-a-hazop-study/"
  to = "/insights/"
  status = 301

[[redirects]]
  from = "/insights/hazid-vs-hazop/"
  to = "/insights/"
  status = 301

[[redirects]]
  from = "/insights/feed-to-operations-project-lifecycle/"
  to = "/insights/"
  status = 301

[[redirects]]
  from = "/insights/operational-readiness-checklist/"
  to = "/insights/"
  status = 301

[[redirects]]
  from = "/insights/plant-start-up-checks/"
  to = "/insights/"
  status = 301

[[redirects]]
  from = "/insights/rcm-vs-preventive-maintenance/"
  to = "/insights/"
  status = 301

[[redirects]]
  from = "/insights/technical-due-diligence-checklist/"
  to = "/insights/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
